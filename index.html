                    { type: "kick", name: "Tobi Kake Geri Chusoku", english: "Jumping Hook Kick (Ball of Foot)", phonetic: "toh-bee kah-keh geh-ree choo-soh-koo", note: "Jumping hook kick aimed at head (ball of foot)" }
                ]
            },
            "3rd Dan (Black)": {
                title: "3rd Dan (Black) • 7 Techniques",
                items: [
                    { type: "strike", name: "Ipponken Uchi Jodan", english: "One-Knuckle Strike (Upper)", phonetic: "eep-pon-ken oo-chee joh-dahn", note: "One-knuckle strike aimed at eyes or face" },
                    { type: "strike", name: "Ipponken Uchi Chudan", english: "One-Knuckle Strike (Middle)", phonetic: "eep-pon-ken oo-chee choo-dahn", note: "One-knuckle strike aimed at solar plexus" },
                    { type: "strike", name: "Nakayubi Ipponken Uchi Jodan", english: "Middle Knuckle Strike (Upper)", phonetic: "nah-kah-yoo-bee eep-pon-ken oo-chee joh-dahn", note: "Middle knuckle strike aimed at face" },
                    { type: "strike", name: "Nakayubi Ipponken Uchi Chudan", english: "Middle Knuckle Strike (Middle)", phonetic: "nah-kah-yoo-bee eep-pon-ken oo-chee choo-dahn", note: "Middle knuckle strike aimed at solar plexus" },
                    { type: "strike", name: "Oyayubiken Jodan", english: "Thumb Knuckle Strike (Upper)", phonetic: "oh-yah-yoo-bee-ken joh-dahn", note: "Thumb knuckle strike aimed at face" },
                    { type: "strike", name: "Oyayubiken Chudan", english: "Thumb Knuckle Strike (Middle)", phonetic: "oh-yah-yoo-bee-ken choo-dahn", note: "Thumb knuckle strike aimed at solar plexus" },
                    { type: "kick", name: "Tobi Ushiro Mawashi Geri", english: "Jumping Spinning Roundhouse", phonetic: "toh-bee oo-shee-roh mah-wah-shee geh-ree", note: "Jumping spinning roundhouse kick aimed at head" }
                ]
            }
        };

        function updateCount() {
            const visible = document.querySelectorAll('.technique-card:not([style*="display: none"])').length;
            document.getElementById('total-count').textContent = visible;
        }

        function filterTechniques() {
            const term = document.getElementById('search-input').value.toLowerCase();
            document.querySelectorAll('.technique-card').forEach(card => {
                const text = card.textContent.toLowerCase();
                card.style.display = text.includes(term) ? '' : 'none';
            });
            updateCount();
        }

        function filterByType(type) {
            if (currentFilter === type && type !== 'all') {
                type = 'all';
            }
            currentFilter = type;

            ['all','strike','block','kick'].forEach(t => {
                const el = document.getElementById('filter-' + t);
                if (el) {
                    if (t === type || (type === 'all' && t === 'all')) {
                        el.style.background = '#111827';
                        el.style.color = 'white';
                    } else {
                        el.style.background = 'white';
                        el.style.color = '#1e293b';
                    }
                }
            });

            document.querySelectorAll('.technique-card').forEach(card => {
                if (type === 'all') {
                    card.style.display = '';
                } else {
                    card.style.display = card.dataset.type === type ? '' : 'none';
                }
            });
            updateCount();
        }

        function renderAll() {
            const container = document.getElementById('content');
            container.innerHTML = '';

            Object.keys(syllabus).forEach(key => {
                const belt = syllabus[key];
                let html = `<div style="margin-bottom:24px;">
                    <div onclick="this.nextElementSibling.style.display = this.nextElementSibling.style.display === 'none' ? '' : 'none'" 
                         style="background:white; padding:12px 16px; border-radius:12px; display:flex; justify-content:space-between; align-items:center; cursor:pointer; border:1px solid #e2e8f0;">
                        <div style="font-weight:700; font-size:15px;">${belt.title}</div>
                        <div style="color:#64748b; font-size:13px;">${belt.items.length} techniques ▼</div>
                    </div>
                    <div style="margin-top:8px;">`;

                belt.items.forEach(item => {
                    const icon = item.type === 'strike' ? 'fa-hand-fist' : item.type === 'block' ? 'fa-shield-halved' : 'fa-shoe-prints';
                    const color = item.type === 'strike' ? '#dc2626' : item.type === 'block' ? '#2563eb' : '#d97706';
                    
                    html += `
                    <div class="technique-card" data-type="${item.type}" style="background:white; border:1px solid #e2e8f0; border-radius:12px; padding:14px; margin-bottom:8px;">
                        <div style="display:flex; align-items:center; gap:8px; margin-bottom:6px;">
                            <i class="fa-solid ${icon}" style="color:${color};"></i>
                            <div style="font-weight:700;">${item.name}</div>
                        </div>
                        <div style="font-size:13px; color:#64748b; margin-bottom:4px;">${item.english}</div>
                        
                        <div class="pronunciation" style="padding:6px 10px; border-radius:8px; font-size:13px; display:flex; align-items:center; gap:6px; background:#111827; color:white;">
                            <span>${item.phonetic}</span>
                        </div>
                        
                        <div style="font-size:12px; color:#64748b; margin-top:6px;">${item.note}</div>
                    </div>`;
                });

                html += `</div></div>`;
                container.innerHTML += html;
            });
            updateCount();
        }

        function initialize() {
            renderAll();
            currentFilter = 'all';
            
            // Show install button hint
            setTimeout(() => {
                const btn = document.getElementById('install-btn');
                if (btn && btn.style.display === 'none' && !deferredPrompt) {
                    // Can add subtle hint here if desired
                }
            }, 8000);
        }

        window.onload = initialize;
    </script>
</body>
</html>
