        let currentFilter = 'all';
        let currentSearch = '';

        function renderTechniques(filteredTechniques) {
            const container = document.getElementById('techniques-container');
            container.innerHTML = '';

            const grouped = {};
            filteredTechniques.forEach(tech => {
                if (!grouped[tech.belt]) grouped[tech.belt] = [];
                grouped[tech.belt].push(tech);
            });

            Object.keys(grouped).forEach(belt => {
                const beltDiv = document.createElement('div');
                beltDiv.innerHTML = `
                    <div class="belt-header" onclick="toggleBelt(this)">
                        <span>${belt} • ${grouped[belt].length} techniques</span>
                        <i class="fa-solid fa-chevron-down"></i>
                    </div>
                    <div class="belt-content" style="display:block;"></div>
                `;
                const contentDiv = beltDiv.querySelector('.belt-content');

                grouped[belt].forEach(tech => {
                    const card = document.createElement('div');
                    card.className = 'technique-card';
                    
                    let videoHTML = '';
                    if (tech.video && tech.video.trim() !== '') {
                        videoHTML = `<a href="${tech.video}" target="_blank" class="video-btn">
                            <i class="fa-brands fa-youtube"></i> Watch Demo
                        </a>`;
                    }

                    card.innerHTML = `
                        <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                            <div>
                                <div style="font-weight:700; font-size:15px;">${tech.japanese}</div>
                                <div style="font-size:13px; color:#64748b;">${tech.english}</div>
                            </div>
                            <div style="font-size:10px; background:#e0e7ff; color:#1e40af; padding:2px 8px; border-radius:9999px; height:fit-content; white-space:nowrap;">
                                ${tech.type.toUpperCase()}
                            </div>
                        </div>
                        
                        <div class="pronunciation" style="margin:10px 0;">${tech.pronunciation}</div>
                        
                        <div style="font-size:13px; color:#475569; line-height:1.4;">
                            ${tech.description}
                        </div>
                        
                        ${videoHTML}
                    `;
                    contentDiv.appendChild(card);
                });

                container.appendChild(beltDiv);
            });
        }

        function toggleBelt(header) {
            const content = header.nextElementSibling;
            const icon = header.querySelector('i');
            if (content.style.display === 'none') {
                content.style.display = 'block';
                icon.classList.remove('fa-chevron-right');
                icon.classList.add('fa-chevron-down');
            } else {
                content.style.display = 'none';
                icon.classList.remove('fa-chevron-down');
                icon.classList.add('fa-chevron-right');
            }
        }

        function filterTechniques() {
            currentSearch = document.getElementById('search-input').value.toLowerCase();
            applyFilters();
        }

        function filterByType(type) {
            currentFilter = type;
            
            // Update button styles
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            if (type === 'all') document.getElementById('filter-all').classList.add('active');
            if (type === 'strike') document.getElementById('filter-strike').classList.add('active');
            if (type === 'block') document.getElementById('filter-block').classList.add('active');
            if (type === 'kick') document.getElementById('filter-kick').classList.add('active');

            applyFilters();
        }

        function applyFilters() {
            let filtered = techniques;

            // Type filter
            if (currentFilter !== 'all') {
                filtered = filtered.filter(t => t.type === currentFilter);
            }

            // Search filter
            if (currentSearch) {
                filtered = filtered.filter(t => 
                    t.japanese.toLowerCase().includes(currentSearch) ||
                    t.english.toLowerCase().includes(currentSearch) ||
                    t.pronunciation.toLowerCase().includes(currentSearch)
                );
            }

            // Update count
            document.getElementById('total-count').textContent = filtered.length;

            renderTechniques(filtered);
        }

        function installPWA() {
            alert("To install: Tap the browser menu (⋮) → 'Install' or 'Add to Home screen'.");
        }

        // Initial render
        function init() {
            document.getElementById('total-count').textContent = techniques.length;
            renderTechniques(techniques);
            
            // Make sure initial filter buttons are correct
            document.getElementById('filter-all').classList.add('active');
        }

        window.onload = init;
    </script>
